<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Relay is a clean, code-first messaging prototype." />
    <meta name="theme-color" content="#0b1110" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b1110'/%3E%3Cpath d='M15 17h34v25H31L20 50v-8h-5z' fill='%23d9ff67'/%3E%3Cpath d='M24 29h16M24 35h10' stroke='%230b1110' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>Relay — Global messaging</title>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar" id="sidebar" aria-label="Conversations">
        <header class="brand-row">
          <a class="brand" href="#" aria-label="Relay home">
            <span class="brand-mark" aria-hidden="true">R</span>
            <span>Relay</span>
          </a>
          <button class="icon-button mobile-only" id="closeSidebar" type="button" aria-label="Close conversations">×</button>
        </header>

        <div class="sidebar-tools">
          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
            <span class="sr-only">Search conversations</span>
            <input id="contactSearch" type="search" placeholder="Search conversations" autocomplete="off" />
            <kbd>⌘ K</kbd>
          </label>
          <button class="add-contact" id="openAddContact" type="button"><span aria-hidden="true">＋</span> Add contact</button>
        </div>

        <section class="conversation-list" aria-labelledby="messagesHeading">
          <div class="section-heading">
            <h2 id="messagesHeading">Messages</h2>
            <span id="contactCount">0</span>
          </div>
          <div id="contactList"></div>
          <p class="empty-list" id="emptyList" hidden>No conversations found.</p>
        </section>

        <button class="profile-card" id="openProfile" type="button" aria-label="Edit your profile">
          <span class="avatar avatar-self" id="selfAvatar">L</span>
          <span class="profile-copy"><strong id="sidebarDisplayName">Levi</strong><small><span class="online-dot"></span> Available</small></span>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </aside>

      <main class="chat" aria-label="Current conversation">
        <header class="chat-header">
          <button class="icon-button mobile-only" id="openSidebar" type="button" aria-label="Open conversations">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h11"/></svg>
          </button>
          <div class="chat-person">
            <span class="avatar" id="activeAvatar">M</span>
            <span><strong id="activeName">Maya Chen</strong><small id="activeStatus">Active now</small></span>
          </div>
          <button class="icon-button" id="conversationInfo" type="button" aria-label="Show contact information" aria-expanded="false">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></svg>
          </button>
        </header>

        <section class="messages" id="messages" aria-live="polite" aria-label="Message history"></section>

        <form class="composer" id="messageForm">
          <label class="message-box">
            <span class="sr-only">Write a message</span>
            <textarea id="messageInput" rows="1" maxlength="1200" placeholder="Write a message…" required></textarea>
            <span class="send-hint">Enter to send</span>
          </label>
          <button class="send-button" type="submit" aria-label="Send message">
            <svg viewBox="0 0 24 24"><path d="m4 12 16-8-5 16-3-7-8-1Z"/><path d="m12 13 8-9"/></svg>
          </button>
        </form>
      </main>

      <aside class="details" id="detailsPanel" aria-label="Contact information">
        <button class="icon-button details-close" id="closeDetails" type="button" aria-label="Close contact information">×</button>
        <span class="eyebrow">Contact details</span>
        <span class="avatar avatar-xl" id="detailsAvatar">M</span>
        <h2 id="detailsName">Maya Chen</h2>
        <p class="muted" id="detailsStatus">Toronto, Canada</p>
        <div class="detail-block">
          <span>Contact code</span>
          <button class="code-copy" id="copyContactCode" type="button"><code id="detailsCode">Maya7C4nQ2</code><span>Copy</span></button>
        </div>
        <div class="detail-block">
          <span>About</span>
          <p id="detailsAbout">Building thoughtful things, one small step at a time.</p>
        </div>
      </aside>
    </div>

    <div class="scrim" id="scrim" hidden></div>

    <dialog id="addContactDialog">
